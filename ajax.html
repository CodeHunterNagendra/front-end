<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            margin: auto;
            width: 500px;
            height: auto;
            background-color: #2b2b2b;
            box-shadow: 5px 5px 3px #fff;

        }

        .container input {
            margin-top: 40px;
            height: 30px;
            width: 80%;
            background-color: aliceblue;
            border-radius: 15px;
            margin: 30px 30px;
        }

        button {
            background-color: #0000ab;
            color: text;
            width: 80%;
            margin: 20px 30px;
            padding: 10px;
            border-radius: 15px;
            color: #fff;
        }

        .container #getdata {
            color: white;
            width: 80%;
            height: auto;
            margin: 30px 20px;
            transition: transform 3s;
        }

        .container #getdata:hover {
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <input type="text" id="country" placeholder="Enter Country Name" />
        <button type="submit" id="btn">Get Data</button>

        <div id="getdata">
        </div>
    </div>

    <script>
        let data = document.getElementById('getdata');
        let text = document.getElementById('country')
        const btn = document.getElementById('btn');
        let url = 'https://restcountries.com/v3.1/name/'

        btn.addEventListener('click', getData)
        function getData() {
            url += text.value
            console.log(url)
            let xhr = new XMLHttpRequest()
            xhr.open('GET', url, true);
            xhr.send()

            xhr.onload = function () {
                let res = xhr.responseText
                let result = JSON.parse(res)
                console.log(result)

                data.innerHTML = `<img src=${result[0].flags.png}  width=300 height=300/>`
            }
        }
        url = 'https://restcountries.com/v3.1/name/'



    </script>
</body>

</html>
